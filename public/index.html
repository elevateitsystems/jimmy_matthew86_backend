<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server is running</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: #f4f7fb;
        background: #06101c url("/server_image.jpg") center / cover no-repeat fixed;
      }

      .shade {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          linear-gradient(180deg, rgba(4, 10, 22, 0.35) 0%, rgba(4, 10, 22, 0.72) 100%),
          radial-gradient(ellipse at center, rgba(6, 16, 32, 0.15), rgba(4, 10, 22, 0.55));
      }

      .panel {
        width: min(640px, 100%);
        text-align: center;
        padding: 48px 36px 40px;
        border: 1px solid rgba(186, 214, 255, 0.22);
        border-radius: 28px;
        background: rgba(7, 16, 32, 0.46);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(10px);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
        padding: 8px 14px 8px 10px;
        border-radius: 999px;
        background: rgba(8, 24, 18, 0.55);
        border: 1px solid rgba(126, 232, 168, 0.35);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 12px;
        font-weight: 700;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #3dff9a;
        box-shadow: 0 0 0 0 rgba(61, 255, 154, 0.7);
        animation: pulse 1.8s infinite;
      }

      h1 {
        font-size: clamp(40px, 6vw, 68px);
        line-height: 0.95;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      p {
        margin-top: 18px;
        color: rgba(244, 247, 251, 0.82);
        font-size: 18px;
        line-height: 1.5;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(61, 255, 154, 0.65);
        }
        70% {
          box-shadow: 0 0 0 12px rgba(61, 255, 154, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(61, 255, 154, 0);
        }
      }

      @media (max-width: 640px) {
        .panel {
          padding: 36px 22px 30px;
          border-radius: 22px;
        }

        p {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shade">
      <section class="panel">
        <div class="status"><span class="dot"></span> Live</div>
        <h1>Server is running</h1>
        <p>Java Maryland container tracking API is online.</p>
      </section>
    </main>
  </body>
</html>
